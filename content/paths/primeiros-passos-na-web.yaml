    terms: [elemento-semantico, landmark, acessibilidade]
    resources: [web-dev-learn]
  - id: formularios
    title: 'Formulários que funcionam'
    description: 'Campos com rótulo, tipos certos e validação do próprio navegador.'
    topic: html/formularios
    terms: [rotulo, validacao-nativa]
    resources: [web-dev-learn]
  - id: css-basico
    title: 'Primeiros estilos'
    description: 'Seletores, cores, tipografia e como o CSS decide qual regra vence.'
    topic: css/fundamentos
    terms: [cascata, especificidade, heranca]
    resources: [mdn, josh-comeau]
  - id: caixas
    title: 'Pensando em caixas'
