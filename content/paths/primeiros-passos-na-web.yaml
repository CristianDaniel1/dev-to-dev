slug: primeiros-passos-na-web
name: Primeiros passos na web
description: 'Do primeiro arquivo HTML a uma página com layout responsivo e interação em JavaScript.'
level: beginner
order: 10
steps:
  - id: estrutura
    title: 'Estrutura de uma página'
