questions:
  - id: css-layout-001
    level: beginner
    prompt: 'Qual é o valor padrão de `flex-direction` em um container com `display: flex`?'
    options:
      - text: '`row`'
        correct: true
        explanation: 'Por padrão, os itens ficam lado a lado, na direção do texto (da esquerda para a direita em português).'
      - text: '`column`'
        explanation: '`column` empilha os itens verticalmente, mas precisa ser declarado.'
      - text: '`row-reverse`'
        explanation: '`row-reverse` inverte a ordem visual e também precisa ser declarado.'
      - text: '`wrap`'
        explanation: '`wrap` é um valor de `flex-wrap`, não de `flex-direction`.'
    explanation: 'A direção define o eixo principal. `justify-content` atua nesse eixo e `align-items` no eixo cruzado.'

  - id: css-layout-002
    level: intermediate
    prompt: 'Em um container com `display: flex` e direção padrão, qual combinação centraliza um item nos dois eixos?'
    options:
      - text: '`justify-content: center;` e `align-items: center;`'
        correct: true
        explanation: '`justify-content` centraliza no eixo principal (horizontal) e `align-items` no eixo cruzado (vertical).'
      - text: '`text-align: center;` e `vertical-align: middle;`'
        explanation: 'Essas propriedades valem para conteúdo em linha e células de tabela, não para itens flex.'
      - text: '`align-content: center;` apenas'
        explanation: '`align-content` distribui linhas quando há quebra (`flex-wrap`). Com uma linha só, não centraliza o item.'
      - text: '`justify-items: center;` e `align-items: center;`'
        explanation: '`justify-items` é ignorado em flexbox. Ele funciona em grid.'
    explanation: 'Em grid, existe um atalho: `display: grid; place-items: center;` centraliza nos dois eixos.'

  - id: css-layout-003
    level: intermediate
    prompt: 'O que a declaração `grid-template-columns: repeat(3, 1fr);` cria?'
    options:
      - text: 'Três colunas que dividem igualmente o espaço disponível'
        correct: true
        explanation: '`fr` é uma fração do espaço livre. Três colunas de `1fr` recebem partes iguais.'
      - text: 'Três colunas de 1 pixel cada'
        explanation: '`fr` não é pixel: é uma fração do espaço disponível.'
      - text: 'Uma coluna que se repete três vezes na vertical'
        explanation: '`grid-template-columns` define colunas, lado a lado. Linhas são definidas por `grid-template-rows`.'
      - text: 'Três linhas de altura igual'
        explanation: 'Linhas são definidas por `grid-template-rows`.'
    explanation: 'Para grids responsivos sem media query, combine com `auto-fit` e `minmax`: `repeat(auto-fit, minmax(240px, 1fr))`.'

  - id: css-layout-004
    level: advanced
    prompt: 'Um elemento com `position: sticky` não gruda no topo ao rolar a página. Qual é a causa mais comum?'
    options:
      - text: 'Faltou definir um deslocamento, como `top: 0`'
        correct: true
        explanation: 'Sem `top` (ou `bottom`, `left`, `right`), o navegador não sabe em que ponto o elemento deve grudar.'
      - text: '`sticky` só funciona dentro de containers com `display: flex`'
        explanation: '`sticky` funciona em qualquer contexto de layout.'
      - text: 'O elemento precisa de `z-index` para grudar'
        explanation: '`z-index` só controla a sobreposição com outros elementos, não o comportamento de grudar.'
      - text: '`position: sticky` foi removido do CSS'
        explanation: 'É suportado por todos os navegadores modernos.'
    explanation: 'Outra causa frequente é um ancestral com `overflow: hidden` ou `auto`: o elemento gruda dentro dele, não na janela.'

  - id: css-layout-005
    level: intermediate
    prompt: 'Em um container flex com três itens, o que acontece com o item que recebe `flex: 1` enquanto os outros não recebem nada?'
    options:
      - text: 'Ele cresce para ocupar todo o espaço livre da linha'
        correct: true
        explanation: '`flex: 1` define `flex-grow: 1`; como os outros têm `flex-grow: 0`, só ele cresce.'
      - text: 'Ele ocupa exatamente um terço da linha'
        explanation: 'Só haveria divisão em terços se os três itens tivessem `flex: 1`.'
      - text: 'Ele passa a ser o primeiro item da linha'
        explanation: 'A posição é controlada por `order`, não por `flex`.'
      - text: 'Ele fica com 1px de largura'
        explanation: 'O número é uma proporção de crescimento, não uma medida.'
    explanation: '`flex: 1` é a forma curta de `flex-grow: 1; flex-shrink: 1; flex-basis: 0%`. É o jeito comum de fazer uma coluna ocupar o que sobra.'

  - id: css-layout-006
    level: intermediate
    prompt: 'Qual é a forma mais simples de criar um espaço de 16px entre os itens de um container flex ou grid, sem espaço extra nas bordas?'
    options:
      - text: '`gap: 16px` no container'
        correct: true
        explanation: 'O `gap` só cria espaço entre os itens, nunca antes do primeiro ou depois do último.'
      - text: '`margin: 16px` em cada item'
        explanation: 'A margem também aparece nas bordas, e seria preciso remover a do primeiro e a do último item.'
      - text: '`padding: 16px` no container'
        explanation: 'O padding cria espaço entre o container e os itens, não entre os itens.'
      - text: '`spacing: 16px` no container'
        explanation: 'Essa propriedade não existe em CSS.'
    explanation: '`gap` aceita dois valores, para linhas e colunas: `gap: 24px 16px`.'

  - id: css-layout-007
    level: advanced
    prompt: 'O que este grid faz?'
    code:
      lang: css
      source: |
        .galeria {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
    options:
      - text: 'Cria quantas colunas de pelo menos 200px couberem e divide a sobra entre elas'
        correct: true
        explanation: 'O número de colunas muda com a largura do container, sem nenhuma media query.'
      - text: 'Cria sempre colunas de exatamente 200px'
        explanation: 'O `1fr` como máximo deixa as colunas crescerem para preencher a linha.'
      - text: 'Cria uma única coluna entre 200px e a largura total'
        explanation: '`auto-fill` repete a coluna quantas vezes couber.'
      - text: 'Gera erro, porque `repeat` exige um número'
        explanation: '`repeat` aceita `auto-fill` e `auto-fit` no lugar do número.'
    explanation: 'A diferença para `auto-fit` aparece com poucos itens: `auto-fill` mantém colunas vazias, e `auto-fit` as colapsa para os itens esticarem.'

  - id: css-layout-008
    level: intermediate
    prompt: 'Um elemento com `position: absolute` e `top: 0` é posicionado em relação a quê?'
    options:
      - text: 'Ao ancestral mais próximo que tenha `position` diferente de `static`'
        correct: true
        explanation: 'Por isso é comum colocar `position: relative` no pai, para servir de referência.'
      - text: 'Sempre ao elemento pai direto'
        explanation: 'Se o pai for `static` (o padrão), o navegador continua subindo na árvore.'
      - text: 'Sempre à janela do navegador'
        explanation: 'Esse é o comportamento de `position: fixed`.'
      - text: 'À posição onde ele estaria no fluxo normal'
        explanation: 'Esse é o comportamento de `position: relative`.'
    explanation: 'Sem nenhum ancestral posicionado, a referência é o bloco inicial do documento. Além disso, o elemento sai do fluxo e não ocupa mais espaço.'
