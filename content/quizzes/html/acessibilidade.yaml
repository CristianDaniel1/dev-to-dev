questions:
  - id: html-acessibilidade-001
    level: beginner
    prompt: 'Qual atributo descreve uma imagem para leitores de tela e aparece no lugar dela se não carregar?'
    options:
      - text: '`alt`'
        correct: true
        explanation: '`alt` é o texto alternativo: lido por leitores de tela, exibido se a imagem falhar e usado por buscadores.'
      - text: '`title`'
        explanation: '`title` mostra uma dica ao passar o mouse, mas não substitui o `alt` e é ignorado em telas de toque.'
      - text: '`src`'
        explanation: '`src` é o endereço do arquivo da imagem.'
      - text: '`aria-hidden`'
        explanation: '`aria-hidden="true"` esconde o elemento das tecnologias assistivas, o oposto de descrever.'
    explanation: 'Um bom `alt` descreve a função da imagem no contexto. Não comece com "imagem de": o leitor de tela já anuncia que é uma imagem.'

  - id: html-acessibilidade-002
    level: intermediate
    prompt: 'Como marcar uma imagem puramente decorativa para que leitores de tela a ignorem?'
    options:
      - text: '`alt=""`'
        correct: true
        explanation: 'Um `alt` vazio indica que a imagem não carrega informação, e os leitores de tela a pulam.'
      - text: 'Omitir o atributo `alt`'
        explanation: 'Sem `alt`, muitos leitores de tela leem o nome do arquivo, como "IMG_2041.jpg".'
      - text: '`alt="imagem decorativa"`'
        explanation: 'Assim o leitor de tela anuncia "imagem decorativa", o que só gera ruído.'
      - text: '`title=""`'
        explanation: '`title` não controla se a imagem é anunciada. O que importa é o `alt`.'
    explanation: 'Se a imagem é só enfeite, outra opção é aplicá-la como `background-image` no CSS, fora do HTML.'

  - id: html-acessibilidade-003
    level: intermediate
    prompt: 'Por que usar `<button>` em vez de `<div onclick="...">` para uma ação clicável?'
    options:
      - text: 'O `<button>` já é focável pelo teclado, responde a Enter e Espaço e é anunciado como botão'
        correct: true
        explanation: 'Com `<div>`, você precisaria recriar tudo isso com `tabindex`, `role` e eventos de teclado, e é fácil esquecer algo.'
      - text: 'O `<div>` não aceita eventos de clique'
        explanation: 'Aceita, sim. O problema é que só o clique funciona: teclado e leitores de tela ficam de fora.'
      - text: 'O `<button>` carrega mais rápido'
        explanation: 'Não há diferença de desempenho relevante entre os dois.'
      - text: 'Não há diferença se o visual for o mesmo'
        explanation: 'A aparência é igual, mas o comportamento para quem usa teclado ou leitor de tela é completamente diferente.'
    explanation: 'A primeira regra de ARIA é: se existe um elemento HTML nativo com o comportamento que você precisa, use-o.'

  - id: html-acessibilidade-004
    level: intermediate
    prompt: 'Qual é o problema de vários links com o texto "clique aqui" na mesma página?'
    options:
      - text: 'Fora do contexto, eles não dizem para onde levam'
        correct: true
        explanation: 'Leitores de tela oferecem uma lista com todos os links da página, e nela aparecem vários "clique aqui" iguais.'
      - text: 'Os buscadores bloqueiam links com esse texto'
        explanation: 'Não há bloqueio, mas um texto descritivo ajuda os buscadores a entender a página de destino.'
      - text: 'O navegador só permite um link com o mesmo texto'
        explanation: 'Não existe essa restrição.'
      - text: 'Nenhum, desde que o texto ao redor explique o link'
        explanation: 'O texto ao redor ajuda quem lê a página inteira, mas não quem navega de link em link.'
    explanation: 'Escreva o destino no próprio link: "Leia o guia de instalação" em vez de "Para ler o guia, clique aqui".'

  - id: html-acessibilidade-005
    level: advanced
    prompt: 'Um `<div role="button">` foi usado no lugar de um `<button>`. O que ainda falta para ele funcionar como um botão de verdade?'
    options:
      - text: 'Adicionar `tabindex="0"` para ele receber foco pelo teclado'
        correct: true
        explanation: 'Um `<div>` não entra na ordem de tabulação; o `tabindex="0"` o coloca lá.'
      - text: 'Disparar a ação ao pressionar Enter e Espaço'
        correct: true
        explanation: 'O `role` só muda o que o leitor de tela anuncia. O comportamento de teclado precisa ser escrito em JavaScript.'
      - text: 'Nada, o `role="button"` já dá todo o comportamento'
        explanation: 'ARIA altera apenas a semântica; ele não adiciona foco nem eventos de teclado.'
      - text: 'Adicionar `aria-hidden="true"`'
        explanation: 'Isso esconderia o elemento dos leitores de tela, o oposto do desejado.'
    explanation: 'Esse é o motivo da primeira regra de ARIA: se existe um elemento nativo com o comportamento que você precisa, use-o. Um `<button>` já vem com tudo isso.'

  - id: html-acessibilidade-006
    level: intermediate
    prompt: 'Para que serve o atributo `lang` em `<html lang="pt-BR">`?'
    options:
      - text: 'Indica o idioma da página, para leitores de tela usarem a pronúncia certa'
        correct: true
        explanation: 'Sem ele, um leitor configurado em inglês pode ler o texto em português com pronúncia inglesa.'
      - text: 'Traduz a página automaticamente'
        explanation: 'O atributo não traduz nada, embora ajude o navegador a decidir se deve oferecer tradução.'
      - text: 'Define a codificação de caracteres'
        explanation: 'A codificação é definida por `<meta charset="utf-8">`.'
      - text: 'Só serve para SEO'
        explanation: 'Ajuda os buscadores, mas também afeta leitores de tela, hifenização e corretores ortográficos.'
    explanation: 'Trechos em outro idioma podem ter o próprio `lang`, por exemplo `<span lang="en">deploy</span>`.'
