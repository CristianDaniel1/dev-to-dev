questions:
  - id: html-formularios-001
    level: beginner
    prompt: 'Como associar um `<label>` ao campo `<input id="email">`?'
    options:
      - text: '`<label for="email">E-mail</label>`'
        correct: true
        explanation: 'O atributo `for` aponta para o `id` do campo. Clicar no rótulo foca o campo, e leitores de tela anunciam o nome.'
      - text: '`<label name="email">E-mail</label>`'
        explanation: '`name` identifica o valor enviado no formulário e pertence ao campo, não ao rótulo.'
      - text: '`<label id="email">E-mail</label>`'
        explanation: 'Dar ao rótulo o mesmo `id` do campo gera ids duplicados e não cria associação.'
      - text: '`<label input="email">E-mail</label>`'
        explanation: 'Não existe o atributo `input` em `<label>`.'
    explanation: 'Outra forma válida é envolver o campo: `<label>E-mail <input type="email"></label>`. O que não pode é deixar o campo sem rótulo.'

  - id: html-formularios-002
    level: intermediate
    prompt: 'Qual atributo impede o envio do formulário enquanto o campo estiver vazio?'
    options:
      - text: '`required`'
        correct: true
        explanation: 'Com `required`, o navegador bloqueia o envio e mostra uma mensagem de validação nativa.'
      - text: '`aria-required="true"`'
        explanation: 'Só informa às tecnologias assistivas que o campo é obrigatório. Não bloqueia o envio.'
      - text: '`mandatory`'
        explanation: 'Não existe o atributo `mandatory` no HTML.'
      - text: '`validate`'
        explanation: 'Não existe `validate`. O oposto existe: `novalidate` no `<form>` desativa a validação nativa.'
    explanation: 'Validação no navegador melhora a experiência, mas não protege nada: os dados sempre precisam ser validados de novo no servidor.'

  - id: html-formularios-003
    level: intermediate
    prompt: 'Dentro de um `<form>`, quais destes botões enviam o formulário ao serem clicados?'
    options:
      - text: '`<button>Enviar</button>`'
        correct: true
        explanation: 'Sem `type`, um `<button>` dentro de formulário é do tipo `submit` por padrão.'
      - text: '`<button type="submit">Enviar</button>`'
        correct: true
        explanation: 'Declarar `type="submit"` deixa a intenção explícita.'
      - text: '`<button type="button">Enviar</button>`'
        explanation: '`type="button"` não tem comportamento padrão. Ele só faz algo se você adicionar JavaScript.'
      - text: '`<input type="reset">`'
        explanation: '`reset` restaura os valores iniciais dos campos e não envia nada.'
    explanation: 'Um erro comum é esquecer o `type` em botões que não deveriam enviar o formulário, como "Mostrar senha". Declare `type="button"` neles.'

  - id: html-formularios-004
    level: intermediate
    prompt: 'Quais vantagens `<input type="email">` traz em relação a `<input type="text">`?'
    options:
      - text: 'Celulares exibem um teclado com `@` em destaque'
        correct: true
        explanation: 'O tipo informa ao sistema qual teclado é mais útil para aquele campo.'
      - text: 'O navegador valida o formato antes de enviar o formulário'
        correct: true
        explanation: 'Um valor sem `@`, por exemplo, bloqueia o envio e mostra uma mensagem nativa.'
      - text: 'O navegador confirma que o e-mail existe'
        explanation: 'A validação é só de formato. Confirmar que o endereço existe exige enviar um e-mail de verificação.'
      - text: 'Dispensa a validação no servidor'
        explanation: 'A validação do navegador pode ser contornada facilmente. O servidor sempre precisa validar de novo.'
    explanation: 'Outros tipos trazem benefícios parecidos: `tel`, `url`, `number` e `date` mudam o teclado ou mostram seletores nativos.'

  - id: html-formularios-005
    level: advanced
    prompt: 'Qual é a forma mais acessível de agrupar opções de rádio sob uma pergunta, como "Forma de pagamento"?'
    options:
      - text: 'Um `<fieldset>` com a pergunta em um `<legend>`'
        correct: true
        explanation: 'Leitores de tela anunciam o `<legend>` ao entrar no grupo, e cada opção ganha o contexto da pergunta.'
      - text: 'Um `<div>` com a pergunta em um `<p>` acima das opções'
        explanation: 'Visualmente funciona, mas o `<p>` não fica associado aos campos; quem navega pelo teclado ouve só "Pix, botão de rádio".'
      - text: 'Um `<label>` envolvendo todas as opções'
        explanation: 'Um `<label>` deve rotular um único campo.'
      - text: 'Um `<select>` com `<optgroup>`'
        explanation: 'Isso troca os rádios por uma lista suspensa, e o `<optgroup>` agrupa opções dentro dela, sem rotular a pergunta.'
    explanation: 'Todos os rádios do grupo devem ter o mesmo `name`. Isso garante que só um seja marcado e que as setas do teclado naveguem entre eles.'
