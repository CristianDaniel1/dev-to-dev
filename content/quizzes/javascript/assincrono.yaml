questions:
  - id: javascript-assincrono-001
    level: intermediate
    prompt: 'O que uma função declarada com `async` sempre retorna?'
    options:
      - text: 'Uma `Promise`'
        correct: true
        explanation: 'Mesmo com `return 5`, quem chama recebe uma Promise que resolve com 5.'
      - text: 'O valor do `return`, diretamente'
        explanation: 'O valor sempre chega embrulhado em uma Promise. Para obtê-lo, use `await` ou `.then()`.'
      - text: '`undefined`'
        explanation: 'Só seria `undefined` se a Promise resolvesse sem valor.'
      - text: 'Um callback'
        explanation: '`async/await` foi criado justamente para substituir o encadeamento de callbacks.'
    explanation: 'Se a função lança um erro, a Promise é rejeitada. Trate com `try/catch` em volta do `await`.'

  - id: javascript-assincrono-002
    level: advanced
    prompt: 'Em que ordem as letras são impressas?'
    code:
      lang: javascript
      source: |
        console.log('A');
        setTimeout(() => console.log('B'), 0);
        Promise.resolve().then(() => console.log('C'));
        console.log('D');
    options:
      - text: 'A, D, C, B'
        correct: true
        explanation: 'Primeiro roda o código síncrono (A, D), depois as microtarefas (Promise: C) e, por fim, as tarefas (setTimeout: B).'
      - text: 'A, B, C, D'
        explanation: 'Mesmo com 0ms, o `setTimeout` agenda o callback para depois do código síncrono.'
      - text: 'A, D, B, C'
        explanation: 'Callbacks de Promise são microtarefas e rodam antes do próximo `setTimeout`.'
      - text: 'A, C, D, B'
        explanation: 'O `.then` nunca executa antes de o código síncrono atual terminar.'
    explanation: 'O event loop esvazia toda a fila de microtarefas antes de pegar a próxima tarefa.'

  - id: javascript-assincrono-003
    level: intermediate
    prompt: 'Três requisições rodam com `Promise.all([a, b, c])` e a requisição `b` falha. O que acontece?'
    options:
      - text: 'A Promise retornada é rejeitada com o erro de `b`'
        correct: true
        explanation: '`Promise.all` rejeita assim que qualquer Promise da lista rejeita.'
      - text: 'Resolve com os resultados de `a` e `c`, ignorando `b`'
        explanation: 'Para receber o resultado de cada uma, com sucesso ou erro, use `Promise.allSettled`.'
      - text: 'Espera as três terminarem e depois resolve'
        explanation: 'Ele não espera as outras para rejeitar. Elas continuam rodando, mas os resultados são descartados.'
      - text: 'Tenta executar `b` de novo automaticamente'
        explanation: 'Promises não têm nenhuma lógica de nova tentativa embutida.'
    explanation: 'Use `Promise.all` quando todos os resultados forem necessários, e `Promise.allSettled` quando falhas parciais forem aceitáveis.'

  - id: javascript-assincrono-004
    level: advanced
    prompt: 'O que este código imprime?'
    code:
      lang: javascript
      source: |
        const esperar = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const processar = async () => {
          [1, 2].forEach(async (n) => {
            await esperar(100);
            console.log(n);
          });
          console.log('fim');
        };

        processar();
    options:
      - text: "'fim', depois 1 e 2"
        correct: true
        explanation: 'O `forEach` não espera os callbacks assíncronos; ele dispara os dois e segue para o `console.log` seguinte.'
      - text: "1, 2 e depois 'fim'"
        explanation: 'Esse seria o resultado com um laço `for...of` e `await esperar(100)` dentro dele.'
      - text: "Só 'fim'"
        explanation: 'Os callbacks continuam rodando e imprimem 1 e 2 depois de 100ms.'
      - text: 'Um erro, porque `forEach` não aceita funções `async`'
        explanation: 'Ele aceita, mas ignora a Promise que cada callback retorna.'
    explanation: 'Para esperar em sequência, use `for...of` com `await`. Para esperar em paralelo, use `await Promise.all(lista.map(async (n) => ...))`.'
