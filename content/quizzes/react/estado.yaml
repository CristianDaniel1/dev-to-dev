questions:
  - id: react-estado-001
    level: intermediate
    prompt: 'Começando em `0`, quanto vale `count` depois de um clique no botão?'
    code:
      lang: jsx
      source: |
        const [count, setCount] = useState(0);

        function handleClick() {
          setCount(count + 1);
          setCount(count + 1);
        }
    options:
      - text: '`1`'
        correct: true
        explanation: 'As duas chamadas usam o mesmo `count` daquela renderização (0), então ambas pedem `0 + 1`.'
      - text: '`2`'
        explanation: 'Seria 2 com a forma de função: `setCount((anterior) => anterior + 1)` duas vezes.'
      - text: '`0`'
        explanation: 'O estado é atualizado, só que com o mesmo valor duas vezes.'
      - text: 'Gera um erro por atualizar o estado duas vezes'
        explanation: 'Chamar o setter várias vezes é permitido. O React agrupa as atualizações em uma renderização.'
    explanation: 'Dentro de uma renderização, o estado é um valor fixo. Quando a atualização depende do valor anterior, use a forma de função.'

  - id: react-estado-002
    level: intermediate
    prompt: 'Qual recurso nativo do React compartilha dados entre componentes distantes sem passar props por todos os níveis?'
    options:
      - text: 'Context (`createContext` e `useContext`)'
        correct: true
        explanation: 'Um Provider disponibiliza o valor para qualquer componente abaixo dele na árvore.'
      - text: '`useRef`'
        explanation: '`useRef` guarda um valor dentro de um único componente.'
      - text: 'Redux'
        explanation: 'Redux resolve esse problema, mas é uma biblioteca externa.'
      - text: '`useMemo`'
        explanation: '`useMemo` memoriza cálculos e não compartilha nada entre componentes.'
    explanation: 'Context é ótimo para dados que mudam pouco, como tema ou usuário logado. Para estado global que muda muito, bibliotecas dedicadas costumam render menos vezes.'

  - id: react-estado-003
    level: intermediate
    prompt: 'Por que a lista não atualiza na tela depois do clique?'
    code:
      lang: jsx
      source: |
        const [tarefas, setTarefas] = useState([]);

        const adicionar = (texto) => {
          tarefas.push(texto);
          setTarefas(tarefas);
        };
    options:
      - text: 'O array foi alterado no lugar e o setter recebeu a mesma referência'
        correct: true
        explanation: 'O React compara o valor novo com o antigo por referência; como é o mesmo array, ele pula a renderização.'
      - text: '`useState` não aceita arrays'
        explanation: 'O estado pode ser qualquer valor, inclusive arrays e objetos.'
      - text: 'Falta chamar `forceUpdate()`'
        explanation: 'Componentes de função não têm `forceUpdate`, e a solução é criar um array novo.'
      - text: '`push` não funciona em arrays de estado'
        explanation: '`push` funciona e altera o array, mas é justamente essa mutação que causa o problema.'
    explanation: 'Crie sempre um valor novo: `setTarefas([...tarefas, texto])`. Para remover, use `filter`; para editar, use `map`.'

  - id: react-estado-004
    level: intermediate
    prompt: 'Um componente tem os estados `nome` e `sobrenome`. Qual é a melhor forma de exibir o nome completo?'
    options:
      - text: 'Calcular durante a renderização: `const completo = nome + " " + sobrenome`'
        correct: true
        explanation: 'Um valor que pode ser derivado de outros não precisa de estado próprio; ele está sempre sincronizado.'
      - text: 'Criar um terceiro estado e atualizá-lo em um `useEffect`'
        explanation: 'Isso causa uma renderização extra com o valor antigo e duplica a fonte da verdade.'
      - text: 'Criar um terceiro estado e atualizá-lo junto com os outros dois'
        explanation: 'Funciona, mas é fácil esquecer de atualizar um deles e os valores ficarem diferentes.'
      - text: 'Guardar o nome completo em uma ref'
        explanation: 'Mudanças em refs não atualizam a tela.'
    explanation: 'Antes de criar um estado, pergunte se ele pode ser calculado a partir de props ou de outro estado. Se o cálculo for caro, use `useMemo`.'

  - id: react-estado-005
    level: intermediate
    prompt: 'Dois componentes irmãos precisam mostrar e alterar o mesmo filtro. Onde o estado do filtro deve ficar?'
    options:
      - text: 'No pai comum mais próximo, que repassa o valor e a função de alterar por props'
        correct: true
        explanation: 'Isso se chama elevar o estado: os dois filhos passam a ler a mesma fonte da verdade.'
      - text: 'Em cada irmão, com um `useEffect` sincronizando os dois'
        explanation: 'Duas cópias do mesmo estado acabam divergindo, e a sincronização gera renderizações extras.'
      - text: 'Em uma variável global fora dos componentes'
        explanation: 'Uma variável comum não avisa o React quando muda, então a tela não atualiza.'
      - text: 'Em um Context na raiz da aplicação'
        explanation: 'Funciona, mas é mais complexo do que o necessário quando o pai comum está logo acima.'
    explanation: 'Comece elevando o estado. Recorra a Context só quando o valor precisar atravessar muitos níveis.'

  - id: react-estado-006
    level: beginner
    prompt: 'O estado `usuario` é um objeto com `nome` e `email`. Como mudar só o `nome`?'
    options:
      - text: "`setUsuario({ ...usuario, nome: 'Bia' })`"
        correct: true
        explanation: 'O spread copia as propriedades atuais, e `nome` é sobrescrito no objeto novo.'
      - text: "`usuario.nome = 'Bia'`"
        explanation: 'Alterar o objeto direto não avisa o React, então a tela não atualiza.'
      - text: "`setUsuario({ nome: 'Bia' })`"
        explanation: 'O `set` substitui o estado inteiro, sem mesclar. O `email` seria perdido.'
      - text: "`setUsuario.nome('Bia')`"
        explanation: 'A função `set` não tem métodos por propriedade.'
    explanation: 'O React compara a referência para saber se o estado mudou. Por isso, objetos e arrays no estado são sempre substituídos por cópias, nunca alterados.'

  - id: react-estado-007
    level: beginner
    prompt: 'Como se chama este padrão de campo de formulário?'
    code:
      lang: jsx
      source: |
        const [texto, setTexto] = useState('');

        return <input value={texto} onChange={(e) => setTexto(e.target.value)} />;
    options:
      - text: 'Input controlado: o estado do React é a fonte do valor exibido'
        correct: true
        explanation: 'Cada tecla chama `setTexto`, e o React redesenha o campo com o valor novo.'
      - text: 'Input não controlado'
        explanation: 'Num input não controlado, o DOM guarda o valor, e você o lê com uma ref ou no envio do formulário.'
      - text: 'Two-way binding automático'
        explanation: 'O React não liga os dois lados sozinho: você escreve o `onChange` explicitamente.'
      - text: 'Um erro, porque `value` não pode vir do estado'
        explanation: 'É o uso mais comum de `value` em React.'
    explanation: 'Se você passar `value` sem `onChange`, o campo fica travado e o React avisa no console. Para só definir o valor inicial, use `defaultValue`.'

  - id: react-estado-008
    level: advanced
    prompt: 'Por que passar `key={usuarioId}` para este formulário?'
    code:
      lang: jsx
      source: |
        <FormularioPerfil key={usuarioId} usuarioId={usuarioId} />
    options:
      - text: 'Para o React descartar o componente e criar outro, com estado zerado, quando o usuário muda'
        correct: true
        explanation: 'Uma `key` diferente faz o React tratar o elemento como outro componente.'
      - text: 'Porque todo componente precisa de `key`'
        explanation: '`key` só é obrigatória em listas. Aqui ela é usada de propósito, fora de uma lista.'
      - text: 'Para o componente ler `usuarioId` com `props.key`'
        explanation: '`key` não chega ao componente como prop. Por isso `usuarioId` é passado separado.'
      - text: 'Para melhorar o desempenho, evitando renderizações'
        explanation: 'O efeito é o contrário: quando a `key` muda, o componente é recriado do zero.'
    explanation: 'Sem a `key`, o React reaproveitaria o componente e o rascunho do usuário anterior continuaria nos campos. É mais simples do que limpar cada estado num `useEffect`.'
