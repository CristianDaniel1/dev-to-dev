resources:
  - id: google-fonts
    name: Google Fonts
    url: https://fonts.google.com/
    description: 'Catálogo de fontes de código aberto, com visualização e download.'
    why: 'Centenas de famílias livres para qualquer projeto; filtre por fontes variáveis para economizar arquivos.'
    type: assets
    pricing: free
    languages: [pt, en]
    techs: [css]
    featured: true
  - id: realtime-colors
    name: Realtime Colors
    url: https://www.realtimecolors.com/
    description: 'Testa uma paleta e um par de fontes aplicados a um site de exemplo, ao vivo.'
    why: 'Você vê a paleta funcionando em uma página real, não em quadradinhos soltos, e exporta o CSS.'
    type: tool
    pricing: free
    languages: [en]
    techs: [css, tailwind]
    featured: true
  - id: webaim-contrast-checker
    name: WebAIM Contrast Checker
    url: https://webaim.org/resources/contrastchecker/
    description: 'Calcula o contraste entre duas cores e diz se atende aos níveis AA e AAA da WCAG.'
    why: 'O jeito mais rápido de confirmar que um texto é legível sobre um fundo.'
    type: tool
    pricing: free
    languages: [en]
    techs: [css]
  - id: coolors
    name: Coolors
    url: https://coolors.co/
    description: 'Gerador de paletas de cores com bloqueio de tons e exportação para CSS.'
    why: 'Aperte espaço até achar uma combinação e trave as cores que gostou.'
    type: tool
    pricing: freemium
    languages: [en]
  - id: oklch-picker
    name: OKLCH Color Picker
    url: https://oklch.com/
    description: 'Seletor de cores no espaço OKLCH, com conversão para hex, RGB e P3.'
    why: 'OKLCH facilita criar escalas de cor com luminosidade uniforme; esta ferramenta mostra como.'
    type: tool
    pricing: free
    languages: [en]
    techs: [css]
  - id: utopia
    name: Utopia
    url: https://utopia.fyi/
    description: 'Calculadoras de tipografia e espaçamento fluidos, que geram clamp() prontos.'
    why: 'Escala tipográfica que cresce suavemente com a tela, sem uma media query por tamanho.'
    type: tool
    pricing: free
    languages: [en]
    techs: [css]
  - id: typescale
    name: Type Scale
    url: https://typescale.com/
    description: 'Gera uma escala tipográfica a partir de um tamanho base e de uma proporção.'
    why: 'Tamanhos de título com proporção consistente deixam a página mais organizada.'
    type: tool
    pricing: free
    languages: [en]
    techs: [css]
  - id: modern-font-stacks
    name: Modern Font Stacks
    url: https://modernfontstacks.com/
    description: 'Pilhas de fontes do sistema agrupadas por estilo, sem baixar nenhum arquivo.'
    why: 'Tipografia com personalidade e custo zero de carregamento.'
    type: reference
    pricing: free
    languages: [en]
    techs: [css]
