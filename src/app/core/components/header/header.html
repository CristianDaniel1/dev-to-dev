<header
  class="sticky top-0 z-40 h-(--header-h) border-b border-line/80 bg-paper/85 backdrop-blur-md"
>
  <div class="container-page flex h-full items-center justify-between gap-4">
    <a routerLink="/" class="-mx-1 rounded-md px-1 py-1" [attr.aria-label]="text.nav.homeLabel">
      <app-logo />
    </a>

    <nav [attr.aria-label]="text.nav.label" class="hidden sm:block">
      <ul class="flex items-center gap-1">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="text-ink after:scale-x-100"
              ariaCurrentWhenActive="page"
              class="relative px-3 py-2 text-sm font-medium text-ink-muted transition-colors after:absolute after:inset-x-3 after:bottom-0.5 after:h-1.5 after:origin-left after:scale-x-0 after:rounded-full after:bg-highlight after:transition-transform after:duration-300 after:content-[''] hover:text-ink"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="btn-icon cursor-pointer gap-2 text-ink-muted hover:text-ink md:w-auto md:border md:border-line md:bg-surface md:px-3 md:text-sm"
        aria-haspopup="dialog"
        aria-keyshortcuts="Control+K Meta+K"
        [attr.aria-label]="text.search.open"
        (click)="palette.open()"
      >
        <app-icon name="search" [size]="18" />
        <span class="hidden md:inline" aria-hidden="true">{{ text.search.open }}</span>
        <span class="kbd hidden md:inline-flex" aria-hidden="true">{{ text.search.shortcut }}</span>
      </button>
      <app-theme-toggle />
      <button
        type="button"
        class="btn-icon sm:hidden"
        aria-haspopup="dialog"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="text.menu.open"
        (click)="isMenuOpen.set(true)"
      >
        <app-icon name="menu" />
      </button>
    </div>
  </div>
</header>

<app-mobile-menu [(open)]="isMenuOpen" [links]="links" />
