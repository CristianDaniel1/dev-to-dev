<header
  class="sticky top-0 z-40 h-(--header-h) border-b-2 border-form bg-sheet [view-transition-name:site-header]"
>
  <div class="container-page flex h-full items-stretch gap-6">
    <a
      routerLink="/"
      class="-mx-1 flex items-center self-center rounded-[3px] px-1 py-1"
      [attr.aria-label]="text.nav.homeLabel"
    >
      <app-logo />
    </a>

    <nav [attr.aria-label]="text.nav.label" class="hidden lg:block">
      <ul class="flex h-full items-stretch border-l border-rule">
        @for (link of links; track link.path) {
          <li class="border-r border-rule">
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              class="group flex h-full items-center gap-2 px-4 text-sm font-semibold text-ink-muted transition-colors hover:bg-sheet-sunken hover:text-ink [&.is-active]:text-ink"
            >
              <span
                class="size-3 rounded-full border-[1.5px] border-form transition-[background-color,border-color,scale] group-hover:scale-125 group-hover:border-ink group-[.is-active]:border-ink group-[.is-active]:bg-ink"
                aria-hidden="true"
              ></span>
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="ml-auto flex items-center gap-1">
      <button
        type="button"
        class="btn-icon cursor-pointer gap-2 lg:w-52 lg:justify-start lg:border-[1.5px] lg:border-rule-strong lg:px-3 lg:text-sm lg:text-ink-muted lg:hover:border-ink"
        aria-haspopup="dialog"
        aria-keyshortcuts="Control+K Meta+K"
        [attr.aria-label]="text.search.open"
        (click)="palette.open()"
      >
        <app-icon name="search" [size]="18" />
        <span class="hidden lg:inline" aria-hidden="true">{{ text.search.open }}</span>
        <span class="kbd ml-auto hidden lg:inline-flex" aria-hidden="true">{{
          text.search.shortcut
        }}</span>
      </button>
      <app-theme-toggle />
      <button
        type="button"
        class="btn-icon lg:hidden"
        aria-haspopup="dialog"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="text.menu.open"
        (click)="isMenuOpen.set(true)"
      >
        <app-icon name="menu" />
      </button>
    </div>
  </div>
</header>

<app-mobile-menu [(open)]="isMenuOpen" [links]="menuLinks" />
