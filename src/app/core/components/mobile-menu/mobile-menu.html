<dialog
  #dialog
  id="mobile-menu"
  [attr.aria-label]="text.nav.label"
  class="m-0 h-dvh max-h-none w-full max-w-none bg-sheet p-0 text-ink"
  (close)="open.set(false)"
>
  <div class="container-page flex h-(--header-h) items-center justify-end border-b-2 border-form">
    <button
      type="button"
      class="btn-icon"
      [attr.aria-label]="text.menu.close"
      (click)="open.set(false)"
    >
      <app-icon name="close" />
    </button>
  </div>
  <nav class="container-page pt-4">
    <ul class="ruled flex flex-col">
      @for (link of links(); track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            class="group flex items-center gap-4 py-5 font-display text-3xl font-extrabold [font-stretch:115%]"
            (click)="open.set(false)"
          >
            <span
              class="size-5 rounded-full border-2 border-form group-[.is-active]:border-ink group-[.is-active]:bg-ink"
              aria-hidden="true"
            ></span>
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</dialog>
