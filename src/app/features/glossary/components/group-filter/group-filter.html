<nav aria-label="Filtrar por tecnologia">
  <ul
    class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:flex-wrap sm:overflow-visible sm:px-0 sm:pb-0"
  >
    <li>
      <a
        routerLink="/glossario"
        class="chip min-h-9 shrink-0 px-3 text-sm whitespace-nowrap"
        [class.chip-active]="!active()"
        [attr.aria-current]="active() ? null : 'page'"
        >Todos</a
      >
    </li>
    @for (group of groups(); track group.slug) {
      <li>
        <a
          routerLink="/glossario"
          [queryParams]="{ grupo: group.slug }"
          class="chip min-h-9 shrink-0 px-3 text-sm whitespace-nowrap"
          [class.chip-active]="active() === group.slug"
          [attr.aria-current]="active() === group.slug ? 'page' : null"
        >
          {{ group.name }}
          <span class="figure text-xs">{{ group.termCount }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
