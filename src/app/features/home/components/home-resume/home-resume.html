@if (isVisible()) {
  <section aria-labelledby="resume-heading" class="container-page pb-12">
    <div
      class="flex flex-col gap-5 rounded-sheet border-[1.5px] border-ink bg-sheet p-5 sm:flex-row sm:items-center sm:gap-10 sm:p-6"
    >
      <h2 id="resume-heading" class="text-lg">Continuar de onde parou</h2>
      @if (dueCount()) {
        <div class="flex flex-wrap items-center gap-3">
          <p>
            <span class="font-bold">
              {{ dueCount() === 1 ? '1 pergunta' : dueCount() + ' perguntas' }}
            </span>
            para revisar hoje
          </p>
          <a routerLink="/revisao" class="btn btn-primary">Revisar agora</a>
        </div>
      }
      @if (last(); as session) {
        <div class="flex flex-wrap items-center gap-3 sm:ml-auto">
          <p class="text-sm text-ink-muted">
            Última sessão: {{ session.title }}, {{ session.correct }} de {{ session.total }}
          </p>
          <a [routerLink]="session.link" class="btn btn-secondary">Continuar</a>
        </div>
      }
    </div>
  </section>
}
