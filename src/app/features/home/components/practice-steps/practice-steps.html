<section class="container-page" aria-labelledby="how-heading">
  <div class="sheet px-5 py-8 sm:px-10 sm:py-10">
    <h2 id="how-heading" class="text-2xl">Instruções</h2>
    <p class="mt-2 text-ink-muted">Como funciona o modo prática, do começo ao fim.</p>
    <ol class="mt-8 grid gap-8 md:grid-cols-3 md:gap-10">
      @for (step of steps; track step.title; let index = $index) {
        <li class="flex gap-4">
          <span class="bubble bubble-filled figure size-9 text-sm" aria-hidden="true">{{
            index + 1
          }}</span>
          <div>
            <h3 class="text-lg">{{ step.title }}</h3>
            <p class="mt-1.5 text-ink-muted">{{ step.description }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
