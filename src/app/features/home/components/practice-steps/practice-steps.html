<section class="border-y border-line bg-surface" aria-labelledby="how-heading">
  <div class="container-page py-16 lg:py-20">
    <h2 id="how-heading" class="text-2xl font-bold">Como funciona o modo prática</h2>
    <ol class="mt-10 grid gap-10 md:grid-cols-3 md:gap-8">
      @for (step of steps; track step.title; let index = $index) {
        <li class="border-t-2 border-ink pt-5">
          <span class="font-mono text-sm text-ink-muted" aria-hidden="true">{{ index + 1 }}</span>
          <h3 class="mt-1 text-xl font-bold">{{ step.title }}</h3>
          <p class="mt-2 text-ink-muted">{{ step.description }}</p>
        </li>
      }
    </ol>
  </div>
</section>
