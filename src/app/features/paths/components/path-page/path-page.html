@if (path(); as current) {
  <div class="container-page pb-20">
    <app-breadcrumb [parents]="trail" [current]="current.name" />

    <header class="border-b border-rule pt-8 pb-10">
      <p class="chip">{{ levelLabels[current.level] }}</p>
      <h1 class="mt-4 text-3xl sm:text-[3.5rem] sm:leading-[0.95]">{{ current.name }}</h1>
      <p class="prose-width mt-4 text-lg text-ink-muted">{{ current.description }}</p>
      <div class="mt-6 max-w-md">
        <p class="text-sm font-semibold" role="status">
          {{ doneCount() }} de {{ current.steps.length }} etapas concluídas
        </p>
        <div class="mt-2 h-2 rounded-[2px] bg-rule" aria-hidden="true">
          <div
            class="h-full rounded-[2px] bg-ink transition-[width]"
            [style.width.%]="(doneCount() / current.steps.length) * 100"
          ></div>
        </div>
      </div>
    </header>

    <ol class="ruled">
      @for (step of current.steps; track step.id; let index = $index) {
        <li>
          <app-path-step [path]="current.slug" [step]="step" [position]="index + 1" />
        </li>
      }
    </ol>
  </div>
} @else {
  <div class="container-page py-16">
    <app-empty-state
      heading="Trilha não encontrada"
      description="Não existe uma trilha com esse endereço. Veja todas as trilhas de estudo."
    >
      <a routerLink="/trilhas" class="btn btn-primary">Ver trilhas</a>
    </app-empty-state>
  </div>
}
