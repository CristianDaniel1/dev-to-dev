@let numbers = overview();
<dl class="sheet grid grid-cols-2 lg:grid-cols-4">
  <div class="border-r border-b border-rule p-5 lg:border-b-0">
    <dt class="form-caption">Respondidas</dt>
    <dd class="figure mt-1 text-4xl font-extrabold">{{ numbers.answered }}</dd>
  </div>
  <div class="border-b border-rule p-5 lg:border-r lg:border-b-0">
    <dt class="form-caption">Dominadas</dt>
    <dd class="figure mt-1 text-4xl font-extrabold">{{ numbers.mastered }}</dd>
  </div>
  <div class="border-r border-rule p-5">
    <dt class="form-caption">Para revisar hoje</dt>
    <dd class="mt-1 flex items-baseline gap-3">
      <span class="figure text-4xl font-extrabold">{{ numbers.due }}</span>
      @if (numbers.due) {
        <a routerLink="/revisao" class="link text-sm">Revisar</a>
      }
    </dd>
  </div>
  <div class="p-5">
    <dt class="form-caption">Sessões</dt>
    <dd class="figure mt-1 text-4xl font-extrabold">{{ numbers.sessions }}</dd>
  </div>
</dl>
