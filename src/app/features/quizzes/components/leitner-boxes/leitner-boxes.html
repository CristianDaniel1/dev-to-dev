<ol class="grid grid-cols-5 gap-2">
  @for (view of boxes(); track view.box) {
    <li
      class="flex flex-col items-center gap-1 rounded-b-sheet border-[1.5px] border-t-4 border-rule-strong border-t-form bg-sheet px-1 pt-2 pb-3 text-center"
    >
      <span class="text-xs text-ink-muted">Caixa {{ view.box }}</span>
      @if (view.count !== null) {
        <span class="figure text-2xl font-extrabold">{{ view.count }}</span>
      }
      <span class="text-xs font-bold text-form-ink">
        {{ view.days === 1 ? '1 dia' : view.days + ' dias' }}
      </span>
    </li>
  }
</ol>
