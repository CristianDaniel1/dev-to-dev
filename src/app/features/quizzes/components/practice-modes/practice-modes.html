<section aria-labelledby="modes-heading">
  <h2 id="modes-heading" class="mb-5 text-xl font-bold">Outros jeitos de praticar</h2>
  <ul class="grid gap-4 sm:grid-cols-3">
    @for (mode of modes; track mode.link) {
      <li>
        <a
          [routerLink]="mode.link"
          class="group card flex h-full flex-col gap-2 p-5 transition-[border-color,box-shadow] hover:border-line-strong hover:shadow-lifted"
        >
          <h3 class="text-lg font-bold group-hover:underline">{{ mode.title }}</h3>
          <p class="text-sm text-ink-muted">{{ mode.description }}</p>
        </a>
      </li>
    }
  </ul>
</section>
