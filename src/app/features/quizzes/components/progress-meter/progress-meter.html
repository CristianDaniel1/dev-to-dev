<div
  class="relative h-2 overflow-hidden rounded-[2px] border border-rule bg-sheet-sunken"
  role="img"
  [attr.aria-label]="label()"
>
  <div
    class="absolute inset-y-0 left-0 origin-left animate-meter opacity-35"
    [style.width.%]="answeredPercent()"
    [style.background-color]="color()"
  ></div>
  <div
    class="absolute inset-y-0 left-0 origin-left animate-meter"
    [style.width.%]="masteredPercent()"
    [style.background-color]="color()"
  ></div>
</div>
@if (showCaption()) {
  <p class="mt-2 text-xs text-ink-muted">{{ label() }}</p>
}
