<div class="container-page">
  <app-page-header
    heading="Quizzes"
    intro="Escolha uma tecnologia para praticar. Cada alternativa tem explicação, e o que você errar volta para revisão."
  />

  @for (area of areas; track area.slug) {
    <section class="mt-10" [attr.aria-labelledby]="'area-' + area.slug">
      <h2 [id]="'area-' + area.slug" class="border-b-2 border-form pb-2 text-xl">
        {{ area.label }}
      </h2>
      <ul class="ruled">
        @for (tech of area.techs; track tech.slug) {
          <li><app-tech-row [tech]="tech" /></li>
        }
      </ul>
    </section>
  }

  <p class="mt-4 text-sm text-ink-muted">
    Backend, DevOps e mais bancos de dados chegam depois do lançamento.
  </p>

  <app-practice-modes class="mt-16 block" />
</div>
