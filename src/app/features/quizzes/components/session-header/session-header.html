@let current = scope();
<div class="flex items-center gap-3">
  @if (current.tech; as tech) {
    <app-tech-badge [tech]="tech" size="sm" />
  } @else {
    <span
      class="inline-flex size-8 items-center justify-center rounded-control bg-highlight text-highlight-ink"
      aria-hidden="true"
    >
      <app-icon name="quiz" [size]="18" />
    </span>
  }
  <p class="font-semibold">{{ current.title }}</p>
  <div class="ml-auto flex items-center gap-2">
    <ng-content />
    <a [routerLink]="current.exitLink" class="btn btn-ghost min-h-9 px-3">Sair</a>
  </div>
</div>

@if (showProgress()) {
  <div class="mt-4 flex items-center gap-3">
    <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-surface-sunken" aria-hidden="true">
      <div
        class="h-full rounded-full transition-[width] duration-500"
        [style.width.%]="progressPercent()"
        [style.background-color]="current.color"
      ></div>
    </div>
    <p class="text-sm text-ink-muted tabular-nums">Pergunta {{ position() }} de {{ total() }}</p>
  </div>
}
