@let current = scope();
<div class="flex items-center gap-3 border-b-2 border-form pb-3">
  @if (current.tech; as tech) {
    <app-tech-badge [tech]="tech" size="sm" />
  } @else {
    <span class="bubble bubble-filled size-7" aria-hidden="true">
      <app-icon name="quiz" [size]="15" />
    </span>
  }
  <p class="font-bold">{{ current.title }}</p>
  <div class="ml-auto flex items-center gap-2">
    <ng-content />
    <a [routerLink]="current.exitLink" class="btn btn-ghost min-h-9 px-3">Sair</a>
  </div>
</div>

@if (showProgress()) {
  <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-3">
    <p class="figure text-sm font-bold">Questão {{ position() }} de {{ total() }}</p>
    <ol class="flex flex-wrap gap-1" aria-hidden="true">
      @for (mark of marks(); track $index; let index = $index) {
        <li
          class="bubble border-[1.5px] text-[0.625rem]"
          [class.size-6]="!isCompact()"
          [class.size-4]="isCompact()"
          [class]="markClasses[mark]"
        >
          @if (!isCompact()) {
            {{ index + 1 }}
          }
        </li>
      }
    </ol>
  </div>
}
