<section aria-labelledby="topics-heading">
  <h2 id="topics-heading" class="text-xl font-bold">Tópicos</h2>
  <ul class="mt-4 border-t border-line">
    @for (topic of tech().topics; track topic.slug) {
      <li class="grid gap-3 border-b border-line py-5 sm:grid-cols-[1fr_12rem] sm:gap-8">
        <div>
          <h3 class="font-semibold">{{ topic.name }}</h3>
          <p class="mt-1 text-sm text-ink-muted">{{ topic.description }}</p>
        </div>
        <div class="sm:pt-1">
          <p class="mb-2 text-xs text-ink-muted">{{ topic.questionCount }} perguntas</p>
          @defer (on idle) {
            <app-tech-progress [tech]="tech()" [topic]="topic.slug" [showCaption]="false" />
          } @placeholder {
            <div class="h-1.5 rounded-full bg-surface-sunken"></div>
          }
        </div>
      </li>
    }
  </ul>
</section>
