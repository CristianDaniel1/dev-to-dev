<section aria-labelledby="topics-heading">
  <h2 id="topics-heading" class="border-b-2 border-form pb-2 text-xl">Conteúdo da prova</h2>
  <ol class="ruled">
    @for (topic of tech().topics; track topic.slug; let index = $index) {
      <li class="grid gap-3 py-5 sm:grid-cols-[2rem_1fr_11rem] sm:gap-6">
        <span class="figure text-sm font-bold text-form-ink" aria-hidden="true">{{
          index + 1
        }}</span>
        <div>
          <h3 class="text-base">{{ topic.name }}</h3>
          <p class="mt-1 text-sm text-ink-muted">{{ topic.description }}</p>
        </div>
        <div class="sm:pt-1">
          <p class="mb-2 text-xs text-ink-muted">{{ topic.questionCount }} perguntas</p>
          @defer (on idle) {
            <app-tech-progress [tech]="tech()" [topic]="topic.slug" [showCaption]="false" />
          } @placeholder {
            <div class="h-2 rounded-[2px] border border-rule bg-sheet-sunken"></div>
          }
        </div>
      </li>
    }
  </ol>
</section>
