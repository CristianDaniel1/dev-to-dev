<nav aria-labelledby="categories-heading">
  <h2 id="categories-heading" class="border-b-2 border-form pb-2 text-lg">Categorias</h2>
  <ol class="mt-1 grid gap-x-8 sm:grid-cols-2 lg:grid-cols-1">
    @for (category of categories; track category.slug) {
      <li>
        <a
          [routerLink]="['/recursos', category.slug]"
          class="group flex items-baseline gap-2 border-b border-rule py-2 text-sm"
        >
          <span class="font-semibold group-hover:underline group-hover:decoration-form">
            {{ category.name }}
          </span>
          <span
            class="min-w-3 flex-1 -translate-y-1 border-b border-dotted border-rule-strong"
            aria-hidden="true"
          ></span>
          <span class="figure text-xs text-ink-muted">
            {{ category.resourceCount }}<span class="sr-only"> recursos</span>
          </span>
        </a>
      </li>
    }
  </ol>
</nav>
