@if (category(); as current) {
  <div class="container-page pb-20">
    <app-breadcrumb [parents]="trail" [current]="current.name" />
    <header class="mb-10 border-b border-rule pt-8 pb-10">
      <h1 class="text-3xl sm:text-[3.5rem] sm:leading-[0.95]">
        {{ current.name }}
      </h1>
      <p class="prose-width mt-4 text-lg text-ink-muted">{{ current.description }}</p>
      <p class="mt-2 text-sm text-ink-muted">{{ countLabel() }} selecionados</p>
    </header>
    <app-resource-browser [category]="current.slug" heading="Recursos da categoria" />
  </div>
} @else {
  <div class="container-page py-16">
    <app-empty-state
      icon="bookmark"
      heading="Categoria não encontrada"
      description="Não existe uma categoria com esse endereço. Veja todas na central de recursos."
    >
      <a routerLink="/recursos" class="btn btn-primary">Ver recursos</a>
    </app-empty-state>
  </div>
}
