<section aria-labelledby="collections-heading">
  <h2 id="collections-heading" class="text-2xl font-bold">Coleções</h2>
  <p class="mt-2 text-ink-muted">Sequências curtas para um objetivo, na ordem em que vale usar.</p>
  <ul class="mt-5 grid gap-4 md:grid-cols-3">
    @for (collection of collections; track collection.slug) {
      <li>
        <a
          [routerLink]="['/recursos/colecoes', collection.slug]"
          class="group card flex h-full flex-col gap-3 p-5 transition-[border-color,box-shadow] hover:border-line-strong hover:shadow-lifted"
        >
          <h3 class="text-lg leading-snug font-bold group-hover:underline">
            {{ collection.name }}
          </h3>
          <p class="text-sm text-ink-muted">{{ collection.description }}</p>
          <p class="mt-auto pt-2 text-sm font-medium text-pen">
            {{ countLabel(collection.itemCount) }} em sequência
          </p>
        </a>
      </li>
    }
  </ul>
</section>
