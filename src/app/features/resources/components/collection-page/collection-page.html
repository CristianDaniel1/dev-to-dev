@if (collection(); as current) {
  <div class="container-page pb-20">
    <app-breadcrumb [parents]="trail" [current]="current.name" />
    <header class="mb-10 border-b border-rule pt-8 pb-10">
      <h1 class="text-3xl sm:text-[3.5rem] sm:leading-[0.95]">
        {{ current.name }}
      </h1>
      <p class="prose-width mt-4 text-lg text-ink-muted">{{ current.description }}</p>
    </header>

    <ol class="ruled max-w-3xl border-t-2 border-form">
      @for (entry of entries(); track entry.resource.id; let index = $index) {
        <li class="grid gap-x-6 pt-6 sm:grid-cols-[3rem_1fr]">
          <span class="bubble bubble-filled figure size-10 text-base" aria-hidden="true">{{
            index + 1
          }}</span>
          <div>
            <p class="mt-3 font-bold sm:mt-2">{{ entry.note }}</p>
            <app-resource-item [resource]="entry.resource" [headingLevel]="2" />
          </div>
        </li>
      }
    </ol>

    <a routerLink="/recursos" class="link mt-14 inline-block font-medium">
      Ver todos os recursos
    </a>
  </div>
} @else {
  <div class="container-page py-16">
    <app-empty-state
      icon="bookmark"
      heading="Coleção não encontrada"
      description="Não existe uma coleção com esse endereço. Veja as coleções na central de recursos."
    >
      <a routerLink="/recursos" class="btn btn-primary">Ver recursos</a>
    </app-empty-state>
  </div>
}
