<span
  class="relative flex size-10 items-center justify-center overflow-hidden rounded-full border-[1.5px] border-form bg-sheet font-display text-base font-extrabold text-form-ink"
>
  {{ initial() }}
  @if (isHydrated() && !hasFailed()) {
    <img
      class="absolute inset-0 m-auto size-5 bg-sheet"
      [src]="src()"
      alt=""
      width="20"
      height="20"
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="hasFailed.set(true)"
    />
  }
</span>
