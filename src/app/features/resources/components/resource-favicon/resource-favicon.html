<span
  class="relative flex size-10 items-center justify-center overflow-hidden rounded-control border border-line bg-surface-sunken text-base font-bold text-ink-muted"
>
  {{ initial() }}
  @if (isHydrated() && !hasFailed()) {
    <img
      class="absolute inset-0 m-auto size-5 bg-surface-sunken"
      [src]="src()"
      alt=""
      width="20"
      height="20"
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="hasFailed.set(true)"
    />
  }
</span>
