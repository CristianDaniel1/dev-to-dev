<form
  role="search"
  aria-label="Filtrar recursos"
  class="sheet flex flex-col gap-5 p-4 sm:p-5"
  (submit)="$event.preventDefault()"
>
  <div class="flex flex-col gap-3 sm:flex-row">
    <label class="relative block flex-1">
      <span class="sr-only">Buscar recursos</span>
      <app-icon
        name="search"
        class="pointer-events-none absolute top-1/2 left-3.5 -translate-y-1/2 text-ink-muted"
      />
      <input
        #search
        type="search"
        class="field pl-11"
        placeholder="Buscar por nome, assunto ou site"
        autocomplete="off"
        (input)="searchChange.emit(search.value)"
      />
    </label>
    <button
      type="button"
      class="btn btn-secondary cursor-pointer lg:hidden"
      aria-controls="resource-filters"
      [attr.aria-expanded]="isExpanded()"
      (click)="isExpanded.set(!isExpanded())"
    >
      {{ isExpanded() ? 'Esconder filtros' : 'Mostrar filtros' }}
      @if (activeCount()) {
        <span class="chip chip-active"
          >{{ activeCount() }}<span class="sr-only"> ativos</span></span
        >
      }
    </button>
  </div>

  <div
    id="resource-filters"
    class="flex-col gap-5 border-t border-rule pt-4 lg:flex"
    [class.flex]="isExpanded()"
    [class.hidden]="!isExpanded()"
  >
    <div class="flex flex-wrap gap-x-10 gap-y-4">
      <fieldset>
        <legend class="form-caption mb-1">Preço</legend>
        <div class="bubble-choices">
          @for (option of pricingOptions(); track option.value) {
            <label>
              <input
                type="radio"
                name="pricing"
                class="sr-only"
                [checked]="filters().pricing === option.value"
                (click)="filtersChange.emit({ pricing: option.value })"
              />
              <span>{{ option.label }}</span>
            </label>
          }
        </div>
      </fieldset>

      <fieldset>
        <legend class="form-caption mb-1">Idioma</legend>
        <div class="bubble-choices">
          @for (option of languageOptions(); track option.value) {
            <label>
              <input
                type="radio"
                name="language"
                class="sr-only"
                [checked]="filters().language === option.value"
                (click)="filtersChange.emit({ language: option.value })"
              />
              <span>{{ option.label }}</span>
            </label>
          }
        </div>
      </fieldset>
    </div>

    <div class="grid gap-4 sm:grid-cols-3 lg:grid-cols-[1fr_1fr_1fr_auto] lg:items-end">
      <label class="flex flex-col gap-1">
        <span class="form-caption">Tipo</span>
        <select #typeSelect class="field" (change)="selectType(typeSelect.value)">
          @for (option of typeOptions(); track option.value) {
            <option [value]="option.value ?? ''" [selected]="filters().type === option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1">
        <span class="form-caption">Tecnologia</span>
        <select #techSelect class="field" (change)="selectTech(techSelect.value)">
          @for (option of techOptions(); track option.value) {
            <option [value]="option.value ?? ''" [selected]="filters().tech === option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1">
        <span class="form-caption">Ordem</span>
        <select #sortSelect class="field" (change)="selectSort(sortSelect.value)">
          @for (option of sortOptions; track option.value) {
            <option [value]="option.value ?? ''" [selected]="filters().sort === option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </label>
      <label class="flex min-h-11 cursor-pointer items-center gap-3 text-sm font-medium">
        <input
          type="checkbox"
          class="size-4 accent-ink"
          [checked]="filters().onlyFavorites"
          (click)="filtersChange.emit({ onlyFavorites: !filters().onlyFavorites })"
        />
        <span>Só meus favoritos</span>
      </label>
    </div>
  </div>
</form>
