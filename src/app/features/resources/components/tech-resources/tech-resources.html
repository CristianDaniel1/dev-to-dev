@if (resources().length) {
  <section aria-labelledby="tech-resources-heading">
    <div class="flex flex-wrap items-baseline justify-between gap-3 border-b-2 border-form pb-2">
      <h2 id="tech-resources-heading" class="text-xl">Para estudar {{ name() }}</h2>
      <a routerLink="/recursos" [queryParams]="{ tech: tech() }" class="link text-sm">
        Ver todos os recursos de {{ name() }}
      </a>
    </div>
    <ul class="grid md:grid-cols-2 md:gap-x-10">
      @for (resource of resources(); track resource.id) {
        <li class="border-b border-rule"><app-resource-item [resource]="resource" /></li>
      }
    </ul>
  </section>
}
