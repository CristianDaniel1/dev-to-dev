<div
  class="flex flex-col items-start gap-4 rounded-sheet border-[1.5px] border-dashed border-rule-strong bg-sheet p-6 sm:p-10"
>
  <span class="bubble size-11 border-2" aria-hidden="true">
    <app-icon [name]="icon()" [size]="20" />
  </span>
  <div class="prose-width">
    <h2 class="text-xl">{{ heading() }}</h2>
    <p class="mt-2 text-ink-muted">{{ description() }}</p>
  </div>
  <ng-content />
</div>
