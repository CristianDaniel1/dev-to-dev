<span
  class="inline-flex items-center justify-center rounded-[3px] font-display font-extrabold [font-stretch:115%]"
  [class]="sizeClasses()"
  [style.background-color]="tech().color"
  [style.color]="tech().onColor"
>
  @if (tech().iconPath; as iconPath) {
    <svg viewBox="0 0 24 24" fill="currentColor" focusable="false" [class]="iconClasses()">
      <path [attr.d]="iconPath" />
    </svg>
  } @else {
    {{ tech().badge }}
  }
</span>
